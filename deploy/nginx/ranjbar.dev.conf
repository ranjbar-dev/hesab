# client SPA -> https://ranjbar.dev
server {
    listen 80;
    listen [::]:80;
    server_name ranjbar.dev www.ranjbar.dev;

    root /opt/hesab/client;
    index index.html;

    # hashed build assets: cache hard
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # static export: real file, then .html, then dir, else SPA shell
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
