# client SPA -> https://ranjbar.dev
server {
    listen 80;
    listen [::]:80;
    server_name ranjbar.dev www.ranjbar.dev;

    root /opt/hesab/client;
    index index.html;

    # hashed build assets: cache hard
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/businesses/[^/]+/?$ {
        try_files /businesses/_/dashboard.html =404;
    }
    location ~ ^/businesses/[^/]+/dashboard/?$ {
        try_files /businesses/_/dashboard.html =404;
    }
    location ~ ^/businesses/[^/]+/members/?$ {
        try_files /businesses/_/members.html =404;
    }
    location ~ ^/businesses/[^/]+/settings/?$ {
        try_files /businesses/_/settings.html =404;
    }

    # static export: real file, then .html, then dir, else SPA shell
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
